name: Build qs-native (Rust / Android ARM64)

on:
  push:
    branches: [GUI, main]
    paths:
      - "daemons/qs-native-rs/**"
      - ".github/workflows/build-qs-native.yml"
  pull_request:
    paths:
      - "daemons/qs-native-rs/**"
      - ".github/workflows/build-qs-native.yml"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, Clippy & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemons/qs-native-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemons/qs-native-rs

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

  build-android:
    name: Cross-compile aarch64-linux-android
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: daemons/qs-native-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemons/qs-native-rs

      - name: Build release binary for Termux (API 24 / aarch64)
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Android NDK not found on runner" >&2
            exit 1
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/qs-native target/qs-native-aarch64-android
          file target/qs-native-aarch64-android
          ls -lh target/qs-native-aarch64-android

      - name: Upload Android binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: qs-native-aarch64-android
          path: daemons/qs-native-rs/target/qs-native-aarch64-android

      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: daemons/qs-native-rs/target/qs-native-aarch64-android
