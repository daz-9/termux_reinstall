; Catppuccin Mocha Polybar config tuned for Termux/Android

[colors]
base = #1e1e2e
surface = #313244
surface1 = #45475a
text = #cdd6f4
subtext = #a6adc8
blue = #89b4fa
mauve = #cba6f7
green = #a6e3a1
teal = #94e2d5
red = #f38ba8

[bar/main]
monitor = ${env:MONITOR:builtin}
width = 100%
height = 40pt
radius = 16
border-size = 8pt
border-color = #00000000
background = ${colors.base}
foreground = ${colors.text}
line-size = 3pt
padding-left = 2
padding-right = 3
module-margin = 2
separator = |
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:size=14;3"
font-1 = "monospace:size=14;3"

cursor-click = pointer
cursor-scroll = ns-resize

modules-left = xwindow
modules-center =
modules-right = cpu memory battery date

wm-restack = bspwm
enable-ipc = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty = Ready
label-foreground = ${colors.text}
label-empty-foreground = ${colors.subtext}

[module/cpu]
type = custom/script
exec = ~/.local/bin/qs-native cpu
tail = true

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.mauve}
label = %gb_used% (%percentage_used%%)

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 30

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %date%  %time%
label-foreground = ${colors.blue}
