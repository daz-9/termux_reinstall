# Lightweight picom v13 config for rounded corners on Termux:X11
# Uses xrender for low-overhead stability on Mali; try "glx" for smoother anti-aliased corners.
backend = "xrender";

corner-radius = 18;
shadow = false;
fading = false;
vsync = true;
use-damage = false;

rules: ({
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "fullscreen";
  corner-radius = 0;
})
