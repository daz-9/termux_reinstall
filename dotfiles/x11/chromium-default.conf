# Termux Chromium stability configuration
if ! pgrep -x chrome >/dev/null 2>&1; then
  rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/chromium/SingletonLock" \
        "${XDG_CONFIG_HOME:-$HOME/.config}/chromium/SingletonSocket" \
        "${XDG_CONFIG_HOME:-$HOME/.config}/chromium/SingletonCookie"
fi

# Prevent global GALLIUM_DRIVER=virpipe from crashing Chromium's GPU process (SIGABRT) unless explicitly requested
if [ "${CHROMIUM_FORCE_VIRGL:-0}" != "1" ]; then
  unset GALLIUM_DRIVER
fi

# 1. --disable-dev-shm-usage: Termux has no /dev/shm
# 2. --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader: avoids Mesa Zink/llvmpipe CompoundImageBacking & StagingBuffer SharedImage failures and enables WebGL
# 3. --disable-features=Vulkan: libvulkan_wrapper.so lacks VK_KHR_surface/VK_KHR_xcb_surface
# 4. --renderer-process-limit=4: keeps child process count below Android 16's 32 phantom-process killer cap
if [ "${CHROMIUM_WRAPPER_ACTIVE:-0}" != "1" ]; then
  CHROMIUM_FLAGS="${CHROMIUM_FLAGS:-} --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader --disable-features=Vulkan --renderer-process-limit=4"
fi
